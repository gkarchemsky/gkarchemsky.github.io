
{%- if jekyll.environment == "production" and site.analytics.provider and site.analytics.token and site.analytics.token != "" -%}

  {%- case site.analytics.provider -%}

  {%- when "cloudflare" -%}
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "{{ site.analytics.token }}"}'></script>

  {%- when "goatcounter" -%}
    <script data-goatcounter="https://{{ site.analytics.token }}.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>

  {%- endcase -%}

{%- endif -%}
