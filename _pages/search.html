---
layout: default
title: Search
permalink: /search/
description: Search the whole site — write-ups, advisories and every section page — by title, tag and text, filtered as you type.
---
<div class="wrap">
  <header class="page-head">
    <h1>Search</h1>
  </header>

  <form class="search-form" role="search" aria-label="Search the site" onsubmit="return false;">
    <label class="sr-only" for="q">Search the site</label>
    <input type="search" id="q" name="q" autocomplete="off" autofocus
           aria-describedby="search-status">
  </form>

  <p class="search-status" id="search-status" role="status" aria-live="polite"></p>

  <ul class="post-list" id="search-results"></ul>

  <noscript>
    <p class="empty">
      Search needs JavaScript. Everything is browsable without it &mdash;
      <a href="{{ '/blog/' | relative_url }}">all posts</a> by date, or
      <a href="{{ '/tags/' | relative_url }}">by tag</a>.
    </p>
  </noscript>
</div>
