<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="gkarchemsky">
  <!-- One icon for both themes, no media query and no JavaScript.

       This file used to carry a prefers-color-scheme rule that swapped to a
       white tile in light mode, and for a while the layout also picked between
       two themed files at load. Both were solving the wrong problem. The old
       palette put a near-black tile on the tab strip, which measures 1.14:1
       against a dark one — the badge had no edge there at all, and swapping it
       for light mode hid that rather than fixing it. Safari also refuses to
       change a favicon after first paint and keeps a persistent on-disk cache,
       so the swapping never worked reliably anyway.

       A mid-cyan tile has an edge both ways: 2.76:1 against a light strip,
       4.52:1 against a dark one. The chevron stays the dark, high-contrast
       shape (5.4:1) because it is what makes the icon recognisable at 16px;
       the white goes on the caret, where 3.1:1 is ample for a solid block.

       The caret is 11x22 — the same 1:2 proportion as `.brand .cursor`
       (0.55em x 1.05em) in main.css, so the tab icon and the blinking cursor
       after the wordmark are the same mark. -->
  <rect width="64" height="64" rx="13" fill="#0a9ecf"/>
  <path d="M16 20 L30 32 L16 44" fill="none" stroke="#04222c" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="40" y="21" width="11" height="22" rx="2" fill="#ffffff"/>
</svg>
