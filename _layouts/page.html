---
layout: default
---
<div class="wrap">
  {%- if page.page_head != false %}
  <header class="page-head{% if page.head_rule == false %} no-rule{% endif %}">
    <h1>{{ page.title }}</h1>
    {%- if page.lede %}<p class="lede">{{ page.lede }}</p>{%- endif %}
  </header>
  {%- endif %}

  <div class="prose">
    {{ content }}
  </div>
</div>
